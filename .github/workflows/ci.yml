name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifier le contenu (modules, schémas, quiz, liens)
        run: node scripts/validate.mjs
      - name: Vérifier la syntaxe JavaScript
        run: node scripts/check-syntax.mjs
